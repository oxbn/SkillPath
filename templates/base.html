<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}SkillPath{% endblock %}</title>
    <script>
      // Inline and blocking on purpose: the stored theme has to be on <html> before the
      // first paint, or a visitor who chose dark sees a white flash on every navigation.
      // Light is the default regardless of the OS setting; dark is opt-in via the toggle.
      (function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem("theme") === "dark" ? "dark" : "light";
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <a class="wordmark" href="/">SkillPath</a>
        <button
          type="button"
          id="theme-toggle"
          class="icon-button"
          aria-label="Switch to dark theme"
          aria-pressed="false"
        >
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        </button>
      </div>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <script src="/static/app.js"></script>
    {% block script %}{% endblock %}
  </body>
</html>
