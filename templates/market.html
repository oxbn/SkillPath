{% extends "base.html" %}

{% block title %}SkillPath — market{% endblock %}

{% block content %}
<header class="page-header">
  <h1>What the market asks for</h1>
  <p class="subtitle">
    Skill demand across every cached job posting.
    <a href="/">Analyze a single posting instead &rarr;</a>
  </p>
</header>

<form id="filter-form">
  <input
    type="text"
    id="title-filter"
    placeholder="Filter by job title, e.g. engineer|data|analyst"
    autofocus
  />
  <div class="actions">
    <button type="submit" id="submit-button">Analyze</button>
    <span class="hint" id="corpus-summary"></span>
  </div>
</form>

<div class="actions">
  <button type="button" id="refresh-button">Refresh now</button>
  <span class="hint" id="refresh-status" role="status"></span>
</div>

<section id="results" aria-live="polite"></section>
{% endblock %}

{% block script %}
<script>
  const form = document.getElementById("filter-form");
  const titleFilter = document.getElementById("title-filter");
  const submitButton = document.getElementById("submit-button");
  const summary = document.getElementById("corpus-summary");
  const results = document.getElementById("results");

  function renderSkills(report) {
    results.replaceChildren();

    const list = el("ol", "skill-list market-list");
    const fills = [];

    const top = report.skills[0]?.share || 1;

    for (const skill of report.skills.slice(0, 40)) {
      const item = document.createElement("li");

      const label = el("div", "market-label");
      const name = el("span", "skill-name", skill.display_name);
      name.title = skill.display_name;
      label.append(name);

      // A high share carried by a single company is usually that company's own jargon,
      // not market demand — worth flagging rather than hiding.
      if (skill.companies === 1 && report.companies > 1) {
        label.append(el("span", "badge badge-warn", "1 company"));
      }

      item.append(label);

      const bar = el("span", "bar");
      const fill = el("span", "bar-fill");
      bar.append(fill);
      item.append(bar);
      fills.push([fill, (skill.share / top) * 100]);

      const share = el("span", "skill-share", `${Math.round(skill.share * 100)}%`);
      share.title = `${skill.postings} of ${report.postings} postings, ${skill.companies} companies`;
      item.append(share);

      list.append(item);
    }

    results.append(list);

    // Widths are applied a frame after the fills are in the DOM so the CSS transition has
    // a zero-width starting point to animate from.
    requestAnimationFrame(() => {
      for (const [fill, percent] of fills) {
        fill.style.width = `${percent}%`;
      }
    });
  }

  async function analyze(event) {
    event?.preventDefault();

    submitButton.disabled = true;
    renderMessage(results, "Analyzing…", "loading");

    const query = titleFilter.value.trim();
    const url = query ? `/api/market?title=${encodeURIComponent(query)}` : "/api/market";

    try {
      const body = await requestJSON(url);

      // Thirty-odd board names wrapped to three lines and crowded the form, so the list
      // moves into a tooltip and only the count stays on screen.
      const companies = el("span", "companies", `${body.companies} companies`);
      companies.title = body.boards.join(", ");
      summary.replaceChildren(`${body.postings.toLocaleString()} postings · `, companies);

      if (body.skills.length === 0) {
        renderMessage(results, "No skills matched this corpus.", "empty");
      } else {
        renderSkills(body);
      }
    } catch (error) {
      renderMessage(results, error.message, "error");
    } finally {
      submitButton.disabled = false;
    }
  }

  form.addEventListener("submit", analyze);
  const refreshButton = document.getElementById("refresh-button");
  const refreshStatus = document.getElementById("refresh-status");
  let wasRefreshing = false;
  let initialStatus = true;

  async function updateStatus() {
    try {
      const status = await requestJSON("/api/refresh");
      refreshButton.disabled = status.running;
      const updated = status.last_updated
        ? `Last successful update: ${new Date(status.last_updated).toLocaleString()}.`
        : "Preparing market data for the first time.";
      const failures = status.failed_boards.length
        ? ` Could not update: ${status.failed_boards.join(", ")}. Will retry automatically.`
        : "";
      refreshStatus.textContent = status.running ? `Refreshing… ${updated}` : updated + failures;
      if ((wasRefreshing && !status.running) || initialStatus) await analyze();
      wasRefreshing = status.running;
      initialStatus = false;
    } catch (error) {
      refreshStatus.textContent = error.message;
    } finally {
      setTimeout(updateStatus, 5000);
    }
  }

  refreshButton.addEventListener("click", async () => {
    refreshButton.disabled = true;
    try {
      await requestJSON("/api/refresh", {method: "POST"});
      wasRefreshing = true;
      refreshStatus.textContent = "Refreshing market data…";
    } catch (error) {
      refreshStatus.textContent = error.message;
      refreshButton.disabled = false;
    }
  });
  updateStatus();
</script>
{% endblock %}
